<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>園中懸賞趣測試</title>
  <style>
    body { background: #060d1f; color: #fff; font-family: sans-serif; padding: 24px; text-align: center; }
    button { font-size: 18px; padding: 14px 24px; border-radius: 12px; border: 0; background: #06b6d4; color: #04101f; font-weight: bold; margin: 10px; }
    #box { margin-top: 20px; padding: 16px; border: 1px solid #22d3ee; border-radius: 12px; background: #0f1c38; }
  </style>
</head>
<body>
  <h2>北園國中 AI未來實驗室｜園中懸賞趣</h2>
  <button id="b1">點我測試按鈕 1</button>
  <button id="b2">點我測試計數 +1</button>
  <div id="box">目前狀態：等待點擊...</div>
  <script>
    let n = 0;
    document.getElementById("b1").onclick = function () {
      document.getElementById("box").innerText = "✅ 按鈕 1 有反應！時間：" + new Date().toLocaleTimeString();
    };
    document.getElementById("b2").onclick = function () {
      n++;
      document.getElementById("box").innerText = "✅ 按鈕 2 有反應！計數：" + n;
    };
  </script>
</body>
</html>
